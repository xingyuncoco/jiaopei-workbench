<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#4F46E5">
  <title>教培工作台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 登录页：未登录时唯一可见的界面 -->
  <div id="loginPage" class="login-page" style="display:none">
    <div class="login-card">
      <div class="login-logo">📚</div>
      <h1 class="login-title">教培工作台</h1>
      <p class="login-subtitle">教师登录</p>
      <form id="loginForm" autocomplete="on">
        <input id="loginEmail" class="login-input" type="email" placeholder="邮箱"
               autocomplete="username" required>
        <input id="loginPassword" class="login-input" type="password" placeholder="密码"
               autocomplete="current-password" required>
        <div id="loginError" class="login-error"></div>
        <button id="loginSubmit" class="login-btn" type="submit">登 录</button>
      </form>
      <p class="login-hint">账号由管理员统一开通，如需请联系负责人</p>
    </div>
  </div>

  <div id="app" style="display:none">
    <!-- 顶部导航 -->
    <header class="header">
      <h1 class="header-title">教培工作台</h1>
      <div class="header-user" id="userInfo">
        <span id="userName" class="user-name"></span>
        <button class="logout-btn" onclick="handleLogout()">退出</button>
      </div>
    </header>

    <!-- 主内容区域 -->
    <main class="main-content">
      <!-- 首页 -->
      <section id="homePage" class="page active">
        <div class="welcome-card">
          <h2>你好，老师！</h2>
          <p id="todayDate"></p>
        </div>

        <div class="module-grid">
          <div class="module-card" onclick="router.navigate('students')">
            <div class="module-icon">👨‍🎓</div>
            <div class="module-name">学生管理</div>
          </div>
          <div class="module-card" onclick="router.navigate('plans')">
            <div class="module-icon">📋</div>
            <div class="module-name">作业规划</div>
          </div>
          <div class="module-card" onclick="router.navigate('correct')">
            <div class="module-icon">📸</div>
            <div class="module-name">拍照批改</div>
          </div>
          <div class="module-card" onclick="router.navigate('summary')">
            <div class="module-icon">📊</div>
            <div class="module-name">总结</div>
          </div>
        </div>

        <div class="quick-tips">
          <div class="quick-tips-head">
            <h3>📌 今日待办</h3>
            <span id="quickListDate" class="quick-date"></span>
          </div>
          <div id="quickList" class="quick-list">
            <p class="empty-tip">暂无待办事项</p>
          </div>
        </div>
      </section>

      <!-- 学生管理页面 -->
      <section id="studentsPage" class="page">
        <div class="page-header">
          <button class="back-btn" onclick="router.navigate('home')">← 返回</button>
          <h2>👨‍🎓 学生管理</h2>
          <button class="add-btn" onclick="students.showAddModal()">＋ 添加</button>
        </div>
        <div id="studentsList" class="item-list"></div>
      </section>

      <!-- 学生学情档案页面 -->
      <section id="profilePage" class="page">
        <div class="page-header">
          <button class="back-btn" onclick="router.navigate('students')">← 返回</button>
          <h2>📈 学情档案</h2>
        </div>
        <div id="profileContent"></div>
      </section>

      <!-- 作业规划页面 -->
      <section id="plansPage" class="page">
        <div class="page-header">
          <button class="back-btn" onclick="router.navigate('home')">← 返回</button>
          <h2>📋 作业规划</h2>
          <button class="add-btn" onclick="plans.showManageSubjects()">⚙️ 科目</button>
        </div>

        <div class="plan-date">
          <button class="date-nav" onclick="plans.changeDate(-1)">◀</button>
          <span id="planDate"></span>
          <button class="date-nav" onclick="plans.changeDate(1)">▶</button>
        </div>

        <div class="plan-student-select">
          <label>选择学生：</label>
          <select id="planStudentSelect" onchange="plans.loadPlans()">
            <option value="">请选择学生</option>
          </select>
        </div>

        <!-- 每日共享备注：核心策略 / 今日预计规划 -->
        <div id="dailyNotesWrap" class="daily-notes-wrap" style="display:none">
          <div class="daily-notes-head">
            <h4>📌 今日共享备注 <span class="daily-notes-date" id="dailyNotesDate"></span></h4>
            <span id="dailyNotesStatus" class="daily-notes-status">未填写</span>
          </div>
          <div class="form-item">
            <label>🎯 今日核心策略</label>
            <textarea id="dailyCoreStrategy" rows="2" placeholder="例：先订正错题再做新题；今天重点关注单位换算"></textarea>
          </div>
          <div class="form-item">
            <label>📝 今日预计规划</label>
            <textarea id="dailyTodayPlan" rows="2" placeholder="例：错题订正 + 课本例题 5 道 + 课后练习"></textarea>
          </div>
          <button class="btn btn-primary btn-sm" onclick="dailyNotes.save()">💾 保存备注</button>
        </div>

        <div id="plansList" class="plans-list"></div>

        <div class="plan-actions">
          <button class="btn btn-outline" onclick="plans.copyPlans()">📋 复制规划</button>
          <button class="btn btn-primary" onclick="plans.showAddPlan()">＋ 添加科目</button>
        </div>
      </section>

      <!-- 科目管理页面 -->
      <section id="subjectsPage" class="page">
        <div class="page-header">
          <button class="back-btn" onclick="router.navigate('plans')">← 返回</button>
          <h2>📚 科目管理</h2>
          <button class="add-btn" onclick="subjects.showAddModal()">＋ 添加</button>
        </div>
        <div id="subjectsList" class="item-list"></div>
      </section>

      <!-- 拍照批改页面（多图版） -->
      <section id="correctPage" class="page">
        <div class="page-header">
          <button class="back-btn" onclick="router.navigate('home')">← 返回</button>
          <h2>📸 拍照批改</h2>
        </div>

        <div class="correct-form">
          <div class="form-group">
            <label>选择学生：</label>
            <select id="correctStudentSelect" onchange="correct.onContextChange()">
              <option value="">请选择学生</option>
            </select>
          </div>

          <div class="form-group">
            <label>选择科目：</label>
            <select id="correctSubjectSelect" onchange="correct.onContextChange()">
              <option value="">请选择科目</option>
            </select>
          </div>

          <div class="correct-photos-bar">
             <span id="correctPhotoCount">已选 0 张</span>
             <input type="file" id="correctImagesInput" accept="image/*" multiple style="display:none" onchange="correct.handleImagesSelect(event)">
             <button class="btn btn-outline btn-sm" onclick="correct.triggerAddPhotos()">＋ 添加照片</button>
           </div>

          <div id="correctThumbnails" class="correct-thumbs"></div>

          <button id="correctBtn" class="btn btn-primary btn-full" onclick="correct.startCorrect()" disabled>
            🔍 开始批改
          </button>

          <button id="correctSaveBtn" class="btn btn-outline btn-full" onclick="correct.saveAll()" style="display:none;margin-top:8px">
            💾 保存到作业规划
          </button>
        </div>

        <div id="correctResult" class="correct-result" style="display:none"></div>
      </section>

      <!-- 总结页面：作业情况 / 日常 / 周总结 三个板块 -->
      <section id="summaryPage" class="page">
        <div class="page-header">
          <button class="back-btn" onclick="router.navigate('home')">← 返回</button>
          <h2>📊 总结</h2>
        </div>

        <div class="summary-tabs">
          <button class="summary-tab active" onclick="summary.switchTab('homework')">作业情况</button>
          <button class="summary-tab" onclick="summary.switchTab('daily')">日常总结</button>
          <button class="summary-tab" onclick="summary.switchTab('weekly')">周总结</button>
        </div>

        <!-- 板块一：作业情况（选学生 + 当天批改明细 + 生成 AI 报告） -->
        <div id="tabHomework" class="summary-tab-panel">
          <div class="summary-date">
            <button class="date-nav" onclick="summary.changeDate(-1)">◀</button>
            <span id="summaryDate"></span>
            <button class="date-nav" onclick="summary.changeDate(1)">▶</button>
          </div>
          <div class="weekly-picker">
            <select id="homeworkStudent" onchange="summary.loadHomeworkDetail()">
              <option value="">请选择学生...</option>
            </select>
            <button class="btn btn-primary" id="homeworkGenerateBtn" onclick="summary.generateHomework()" disabled>✨ 生成作业情况报告</button>
          </div>

          <!-- 当天批改明细表（按科目合并多次批改） -->
          <div id="homeworkDetail" class="summary-content">
            <p class="hint">请选择学生查看当天作业情况</p>
          </div>

          <!-- AI 报告输出区 -->
          <div id="summaryContent" class="summary-content"></div>
          <div id="summaryActions" class="summary-actions" style="display:none">
            <button class="btn btn-outline" onclick="summary.copySummary()">📋 复制</button>
            <button class="btn btn-primary" onclick="summary.regenerate()">🔄 重新生成</button>
          </div>

          <div class="history-section">
            <div class="history-head"><h4>📚 历史记录</h4></div>
            <div id="homeworkHistory"></div>
          </div>
        </div>

        <!-- 板块二：日常总结（必选学生 + 老师备注） -->
        <div id="tabDaily" class="summary-tab-panel" hidden>
          <div class="summary-date">
            <button class="date-nav" onclick="summary.changeDate(-1)">◀</button>
            <span id="dailyDate"></span>
            <button class="date-nav" onclick="summary.changeDate(1)">▶</button>
          </div>
          <div class="weekly-picker">
            <select id="dailyStudent" onchange="summary.onStudentChange('daily')"></select>
          </div>
          <div class="form-item">
            <label>老师反馈（今天做了什么 / 孩子实际情况 / 计划做什么）</label>
            <textarea id="dailyTeacherNote" rows="4" placeholder="例：今天陪孩子复习了分数应用题，做了 8 道题，错了 3 道。明天计划做单位换算专项练习。"></textarea>
          </div>
          <button class="btn btn-primary" id="dailyGenerateBtn" onclick="summary.generateDaily()" disabled>✨ 生成报告</button>
          <div id="dailyContent"></div>
          <div class="history-section">
            <div class="history-head"><h4>📚 历史记录</h4></div>
            <div id="dailyHistory"></div>
          </div>
        </div>

        <!-- 板块三：周总结（必选学生 + 生成） -->
        <div id="tabWeekly" class="summary-tab-panel" hidden>
          <div class="weekly-picker">
            <select id="weeklyStudent" onchange="summary.onStudentChange('weekly')"></select>
            <button class="btn btn-primary" id="weeklyGenerateBtn" onclick="summary.generateWeekly()" disabled>✨ 生成报告</button>
          </div>
          <div id="weeklyContent"></div>
          <div class="history-section">
            <div class="history-head"><h4>📚 历史记录</h4></div>
            <div id="weeklyHistory"></div>
          </div>
        </div>

        <!-- 历史记录清理面板（所有板块共用） -->
        <div class="history-clean">
          <button class="btn btn-outline btn-sm" onclick="summary.showClearDialog()">🗑 清理历史记录</button>
        </div>
      </section>
    </main>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <div class="nav-item active" onclick="router.navigate('home')">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">首页</span>
      </div>
      <div class="nav-item" onclick="router.navigate('students')">
        <span class="nav-icon">👨‍🎓</span>
        <span class="nav-label">学生</span>
      </div>
      <div class="nav-item" onclick="router.navigate('plans')">
        <span class="nav-icon">📋</span>
        <span class="nav-label">规划</span>
      </div>
      <div class="nav-item" onclick="router.navigate('summary')">
        <span class="nav-icon">📊</span>
        <span class="nav-label">总结</span>
      </div>
    </nav>
  </div>

  <!-- 模态框容器 -->
  <div id="modalContainer" class="modal-container" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">标题</h3>
        <button class="modal-close" onclick="modal.close()">×</button>
      </div>
      <div id="modalContent" class="modal-content"></div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="toast"></div>

  <!-- 加载状态 -->
  <div id="loading" class="loading-overlay" style="display:none">
    <div class="loading-spinner"></div>
    <p id="loadingText">处理中...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
